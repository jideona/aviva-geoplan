server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — every route serves index.html, client-side router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never let a stale service worker or index.html get stuck on a phone
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
