server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Static assets that are genuinely missing (e.g. a font glyph range
    # outside what scripts/generate-glyphs.js pre-generates) must 404, not
    # silently fall back to index.html — MapLibre's PBF parser chokes
    # trying to read HTML as protobuf if it does ("Unimplemented type: N").
    # The app already handles a genuinely-missing glyph gracefully (no
    # error, no text) when it gets a real 404 instead.
    location /fonts/ {
        try_files $uri =404;
    }

    # SPA fallback — every route serves index.html, client-side router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never let a stale index.html get stuck in a browser cache
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
